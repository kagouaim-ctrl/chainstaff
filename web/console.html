<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAGOU 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c;--surface:#121214;--raise:#18181b;--line:#26262a;--line2:#33333a;--text:#ededed;--muted:#8a8a8f;
  --signal:#f0b90b;--ok:#3ddc84;--review:#f0b90b;--block:#ff4d4d;--info:#7aa7ff;
  --sans:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f6f4;--surface:#ffffff;--raise:#f0f0ed;--line:#e1e1dc;--line2:#cfcfc8;--text:#111112;--muted:#64646b;
  --signal:#b88a00;--ok:#13894f;--review:#a87400;--block:#d0302f;--info:#2f5fd0;color-scheme:light;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"])[data-auto="1"]{
  --bg:#f6f6f4;--surface:#ffffff;--raise:#f0f0ed;--line:#e1e1dc;--line2:#cfcfc8;--text:#111112;--muted:#64646b;
  --signal:#b88a00;--ok:#13894f;--review:#a87400;--block:#d0302f;--info:#2f5fd0;color-scheme:light}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.mono,code,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ok{color:var(--ok)} .review{color:var(--review)} .block{color:var(--block)} .info{color:var(--info)}
.label{font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:20px} h2{font-size:15px} h3{font-size:13px}

/* buttons and inputs: radius 2px max, hairlines, no shadows */
.btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line2);background:var(--surface);border-radius:2px;padding:6px 12px;cursor:pointer;font-size:13px;line-height:1.4;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav a:focus-visible,summary:focus-visible{outline:1px solid var(--signal);outline-offset:1px}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.signal{background:var(--signal);color:#0b0b0c;border-color:var(--signal);font-weight:600}
.btn.danger{border-color:var(--block);color:var(--block)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:2px;padding:6px 8px;min-width:0;width:100%}
textarea{resize:vertical;min-height:72px}
input[type=checkbox]{width:auto;accent-color:var(--signal)}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
label.f > span:first-child{font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text)}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand b{font:700 17px/1 var(--sans);letter-spacing:.02em;font-stretch:125%}
.nav{display:flex;flex-direction:column;padding:8px 0;overflow:auto;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 18px;text-decoration:none;color:var(--muted);font-size:13px;border-left:2px solid transparent}
.nav a .n{font:500 11px var(--mono);color:var(--muted);width:22px}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);border-left-color:var(--signal);background:var(--surface)}
.nav a .badge{margin-left:auto}
.side-foot{border-top:1px solid var(--line);padding:12px 18px;display:grid;gap:6px;font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px;flex-wrap:wrap}
.top h1{margin-right:auto}
.page{padding:20px 24px 80px;display:grid;gap:16px;max-width:1280px;width:100%}
.grid{display:grid;gap:16px}
.grid > *,.stack > *{min-width:0}
#simEx .btn,.sug .btn{white-space:normal;text-align:left}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:2px;min-width:0}
.card > .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card > .hd h2{margin-right:auto}
.card > .bd{padding:14px 16px}
.card > .bd.flush{padding:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:10px}
.kpi{padding:14px 16px;display:grid;gap:6px;align-content:start}
.kpi .v{font:500 24px/1.15 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;word-break:break-all}
.kpi .s{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.04em;padding:4px 7px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.pill.muted{color:var(--muted)}
.dot{width:6px;height:6px;display:inline-block;background:currentColor}
.badge{font:500 11px/1 var(--mono);padding:3px 6px;background:var(--signal);color:#0b0b0c;border-radius:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border:1px solid var(--line2);border-radius:2px;white-space:nowrap}
.chip.block{border-color:var(--block)} .chip.review{border-color:var(--review)} .chip.ok{border-color:var(--ok)}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 2px}
.scroll{overflow-x:auto}
#limits input{min-width:90px}
.msg,.report{overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 12px;white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{border-bottom:1px solid var(--line);padding:9px 12px;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--raise)}
td.r,th.r{text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.bar{height:6px;background:var(--line);position:relative}
.bar > i{position:absolute;inset:0 auto 0 0;background:var(--text)}
.bar.warn > i{background:var(--review)} .bar.over > i{background:var(--block)}
.addr{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
.copy{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font:11px var(--mono)}
.copy:hover{color:var(--text)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;word-break:break-all}
.feed{display:grid}
.feed .it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;align-items:start}
.feed .it:last-child{border-bottom:0}
.feed .it > div{min-width:0;overflow-wrap:anywhere}
.feed .k{font:500 10px/1.8 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:0 6px;border:1px solid var(--line2);color:var(--muted)}
.feed .k.alert{color:var(--block);border-color:var(--block)} .feed .k.audit{color:var(--text)} .feed .k.system{color:var(--info);border-color:var(--info)}
.feed .k.telegram_in,.feed .k.telegram_out{color:var(--signal);border-color:var(--signal)}
.feed .t{font:11px var(--mono);color:var(--muted);white-space:nowrap}
pre.report{white-space:pre-wrap;margin:0;font:13px/1.7 var(--sans);background:var(--bg);border:1px solid var(--line);padding:14px;border-radius:2px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--signal)}
.note{border:1px solid var(--line2);border-left:2px solid var(--review);padding:10px 12px;font-size:13px;background:var(--bg)}
.note.block{border-left-color:var(--block)} .note.ok{border-left-color:var(--ok)} .note.info{border-left-color:var(--info)}
.steps{counter-reset:s;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;font-size:13px}
.steps li::before{content:counter(s,decimal-leading-zero);font:500 11px/1.9 var(--mono);color:var(--muted)}
.steps li.done::before{content:"✓";color:var(--ok)}

/* chat (Telegram simulator and log) */
.chat{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--bg);height:420px;overflow-y:auto}
.msg{max-width:86%;padding:8px 10px;border:1px solid var(--line2);border-radius:2px;white-space:pre-wrap;font-size:13px;line-height:1.55;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--raise)}
.msg.bot{align-self:flex-start;background:var(--surface)}
.msg .who{display:block;font:500 10px/1.6 var(--mono);color:var(--muted);letter-spacing:.04em}
.chatbar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.sug{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}

/* chart */
.chart svg{display:block;width:100%;height:180px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;margin-right:6px}

/* drawer, modal, toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column}
.drawer .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .bd{padding:16px;overflow:auto;display:grid;gap:16px;align-content:start}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line2);z-index:42;display:grid}
.modal .bd{padding:16px;display:grid;gap:12px}
.modal .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--surface);border:1px solid var(--line2);border-left:2px solid var(--ok);padding:10px 12px;font-size:13px}
.toast.bad{border-left-color:var(--block)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .card{width:min(420px,100%)}

.demo{background:var(--signal);color:#0b0b0c;font-size:12px;padding:6px 24px;display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:30;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:12px 16px}
  .nav{flex-direction:row;padding:0;overflow-x:auto;scrollbar-width:none}
  .nav a{border-left:0;border-bottom:2px solid transparent;padding:10px 12px;white-space:nowrap}
  .nav a .n{display:none}
  .nav a[aria-current="page"]{border-bottom-color:var(--signal);background:none}
  .side-foot{display:none}
  .top{position:static;padding:12px 16px}
  .page{padding:16px 16px 80px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi .v{font-size:20px}
  .span2{grid-column:auto}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:4px}
  .hide-sm{display:none}
  .demo{padding:6px 16px}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden></div>

<section class="login" id="login">
  <div class="card">
    <div class="hd"><h2>KAGOU 控制台</h2><span class="label">OWNER CONSOLE</span></div>
    <div class="bd stack">
      <p class="muted" style="margin:0">输入部署时设置的控制台令牌（<code>CHAINSTAFF_CONSOLE_TOKEN</code>）。令牌只存在这个浏览器标签页里，关掉就失效。</p>
      <label class="f"><span>令牌</span><input id="token" type="password" autocomplete="off" spellcheck="false"></label>
      <div class="row"><button class="btn primary" id="connect">进入控制台</button><span id="loginMsg" class="block"></span></div>
    </div>
  </div>
</section>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><b>KAGOU</b><span class="label">控制台</span></div>
    <nav class="nav" id="nav" aria-label="页面"></nav>
    <div class="side-foot">
      <span class="muted" id="footMode"></span>
      <span class="muted">更新于 <span class="mono" id="footTime">—</span></span>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="title">总览</h1>
      <span id="pills" class="row"></span>
      <button class="btn sm" id="refresh" title="刷新（R）">刷新</button>
      <button class="btn sm danger" id="kill"></button>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<div id="overlay"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let token='';try{token=sessionStorage.getItem('cs-token')||''}catch(e){}

// ---------- API ----------
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401){logout('令牌不对或已失效');throw new Error('令牌不对')}
  const ct=r.headers.get('content-type')||'';
  const body=ct.includes('json')?await r.json().catch(()=>({})):await r.text();
  if(!r.ok) throw new Error((body&&body.detail)||('请求失败 '+r.status));
  return body;
}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});
const put=(p,b)=>api(p,{method:'PUT',body:JSON.stringify(b)});

// ---------- formatting ----------
let TZ='Asia/Shanghai';
const fmtNum=v=>{const n=Number(v);if(!isFinite(n))return esc(v);return n.toLocaleString('en-US',{maximumFractionDigits:6})};
const fmtAmt=(v,t)=>`<span class="num">${fmtNum(v)}</span> <span class="muted">${esc(t)}</span>`;
const fmtMoved=m=>{const e=Object.entries(m||{});return e.length?e.map(([t,v])=>fmtAmt(v,t)).join('<br>'):'<span class="muted">0</span>'};
function fmtTime(iso,withDate=true){if(!iso)return '—';const d=new Date(iso);if(isNaN(d))return esc(iso);
  try{return d.toLocaleString('zh-CN',{timeZone:TZ,hour12:false,...(withDate?{month:'2-digit',day:'2-digit'}:{}),hour:'2-digit',minute:'2-digit'})}catch(e){return d.toISOString().slice(0,16).replace('T',' ')}}
function ago(iso){if(!iso)return '从未';const s=(Date.now()-new Date(iso))/1000;if(s<60)return '刚刚';if(s<3600)return Math.floor(s/60)+' 分钟前';if(s<86400)return Math.floor(s/3600)+' 小时前';return Math.floor(s/86400)+' 天前'}
const short=a=>a&&a.length>14?a.slice(0,6)+'…'+a.slice(-4):(a||'');
const addr=(a,url)=>a?`<span class="addr"><span title="${esc(a)}">${esc(short(a))}</span><button class="copy" data-copy="${esc(a)}" title="复制">复制</button>${url?`<a class="copy" href="${esc(url)}" target="_blank" rel="noreferrer">浏览器</a>`:''}</span>`:'<span class="muted">—</span>';
const STATUS={executing:['执行中','review'],paid:['已自动付','ok'],failed:['失败','block'],pending_approval:['待签字','review'],approved:['老板已签','ok'],rejected:['已驳回','muted'],blocked:['已拦截','block']};
const OUTCOME={AUTO_PAY:['自动付','ok'],NEEDS_APPROVAL:['需签字','review'],BLOCK:['拦截','block']};
const st=s=>{const [l,c]=STATUS[s]||[s,'muted'];return `<span class="pill ${c}"><span class="dot"></span>${l}</span>`};
const KIND={audit:'操作',alert:'预警',telegram_in:'收到',telegram_out:'发出',system:'系统'};
const WEEK=['周一','周二','周三','周四','周五','周六','周日'];

// ---------- UI helpers ----------
function toast(t,bad){const el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.textContent=t;$('#toasts').append(el);setTimeout(()=>el.remove(),bad?6000:3200)}
function confirmBox(title,body,okText='确认',danger=false){return new Promise(res=>{
  $('#overlay').innerHTML=`<div class="scrim" data-x></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="bd"><h2 id="mt">${esc(title)}</h2><div class="muted">${body}</div></div><div class="ft"><button class="btn" data-x>取消</button><button class="btn ${danger?'danger':'primary'}" data-ok>${esc(okText)}</button></div></div>`;
  const close=v=>{$('#overlay').innerHTML='';res(v)};
  $('#overlay').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>close(false));
  $('#overlay').querySelector('[data-ok]').onclick=()=>close(true);
  $('#overlay').querySelector('[data-ok]').focus();
})}
function drawer(title,html){$('#overlay').innerHTML=`<div class="scrim" data-x></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="hd"><h2 class="grow">${esc(title)}</h2><button class="btn sm" data-x>关闭</button></div><div class="bd">${html}</div></aside>`;
  $('#overlay').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{$('#overlay').innerHTML=''});}
async function act(fn,ok){try{const r=await fn();toast(ok||r?.message||'已完成');await refresh();return r}catch(e){toast(e.message,true)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;e.stopPropagation();
  (navigator.clipboard?navigator.clipboard.writeText(b.dataset.copy):Promise.reject()).then(()=>toast('已复制'),()=>toast('复制失败，请手动选择',true))});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay').innerHTML='';
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='r'&&!e.metaKey&&!e.ctrlKey)refresh();});
function card(title,body,{right='',flush=false,id='',cls=''}={}){return `<section class="card ${cls}" ${id?`id="${id}"`:''}><div class="hd"><h2>${title}</h2>${right}</div><div class="bd${flush?' flush':''}">${body}</div></section>`}

// ---------- state & routing ----------
const PAGES=[
  ['overview','总览','01'],['approvals','审批','02'],['ledger','账本','03'],['payees','收款人','04'],['rules','规则与试算','05'],
  ['treasury','国库与预警','06'],['employee','员工档案','07'],['telegram','Telegram','08'],['reports','报告','09'],['audit','审计日志','10'],['settings','设置','11']];
const S={status:null,route:'overview',ledger:{limit:100,f:{}},audit:{kind:'',items:[]},tgChat:[],dirtyRules:false};
function route(){const r=(location.hash||'#overview').slice(1).split('?')[0];return PAGES.some(p=>p[0]===r)?r:'overview'}
function renderNav(){const pend=S.status?.pending||0;
  $('#nav').innerHTML=PAGES.map(([k,l,n])=>`<a href="#${k}" ${S.route===k?'aria-current="page"':''}><span class="n">${n}</span>${l}${k==='approvals'&&pend?`<span class="badge">${pend}</span>`:''}</a>`).join('')}
function renderTop(){const s=S.status||{};
  $('#title').textContent=PAGES.find(p=>p[0]===S.route)[1];
  const pills=[s.live?'<span class="pill block"><span class="dot"></span>实盘</span>':'<span class="pill muted"><span class="dot"></span>测试模式</span>'];
  if(s.read_only)pills.push('<span class="pill review">试用只读</span>');
  if(s.paused)pills.push('<span class="pill block">已暂停</span>');
  $('#pills').innerHTML=pills.join('');
  $('#kill').textContent=s.paused?'恢复付款':'一键暂停';$('#kill').className='btn sm '+(s.paused?'ok':'danger');
  $('#footMode').textContent=s.live?'实盘：绿灯付款会真的上链':'测试模式：不会真的上链';
  $('#footTime').textContent=fmtTime(new Date().toISOString(),false);
  renderNav();}
$('#kill').onclick=async()=>{const p=S.status?.paused;
  if(!p&&!await confirmBox('暂停所有付款？','暂停后员工收到的每一笔付款请求都会被拦截，直到你恢复。已经在链上的交易不受影响。','暂停',true))return;
  act(()=>post(p?'/api/resume':'/api/pause'))};
$('#refresh').onclick=()=>refresh(true);

async function refresh(say){
  try{
    const [s,r]=await Promise.all([api('/api/status'),api('/api/rules')]);
    S.status={...s,read_only:!!r.read_only};S.rules=r;TZ=r.timezone||TZ;
    renderTop();await render();if(say)toast('已刷新');
  }catch(e){toast(e.message,true)}
}
window.addEventListener('hashchange',()=>{if(S.dirtyRules&&S.route==='rules'&&!confirm('规则还没保存，确定离开？')){history.replaceState(null,'','#rules');return}S.dirtyRules=false;S.route=route();renderTop();render();window.scrollTo(0,0)});

async function render(){
  const page=$('#page');
  try{page.innerHTML=await VIEWS[S.route]();BIND[S.route]&&BIND[S.route]()}
  catch(e){page.innerHTML=`<div class="note block">这一页没加载出来：${esc(e.message)}</div>`}
}

// ---------- 01 overview ----------
function chart(series){
  const W=720,H=180,P=24,n=series.length,bw=(W-P)/n;
  const max=Math.max(1,...series.map(d=>d.auto+d.approval+d.block));
  let bars='',labels='';
  series.forEach((d,i)=>{let y=H-20;const x=P+i*bw+2,w=Math.max(2,bw-5);
    for(const [k,c] of [['auto','var(--ok)'],['approval','var(--review)'],['block','var(--block)']]){const h=d[k]/max*(H-36);if(h>0){y-=h;bars+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"><title>${d.date} ${k==='auto'?'自动付':k==='approval'?'需签字':'拦截'} ${d[k]}</title></rect>`}}
    if(i%Math.ceil(n/7)===0||i===n-1)labels+=`<text x="${x+w/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--mono)">${d.date.slice(5)}</text>`});
  const grid=[0,.5,1].map(f=>{const y=H-20-f*(H-36);return `<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="0" y="${y+3}" font-size="10" fill="var(--muted)" font-family="var(--mono)">${Math.round(max*f)}</text>`}).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="近 ${n} 天付款请求">${grid}${bars}${labels}</svg></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>自动付</span><span><i style="background:var(--review)"></i>需签字</span><span><i style="background:var(--block)"></i>拦截</span></div>`}
function budgetBars(b){return b.length?b.map(x=>{const p=Number(x.limit)>0?Math.min(100,Number(x.spent)/Number(x.limit)*100):0;
  return `<div class="stack" style="gap:4px"><div class="row"><span class="grow">${esc(x.token)}</span><span class="num">${fmtNum(x.spent)} / ${fmtNum(x.limit)}</span></div><div class="bar ${p>=100?'over':p>=80?'warn':''}"><i style="width:${p}%"></i></div></div>`}).join(''):'<p class="muted">还没设每日上限。</p>'}
function feed(items,empty='暂无记录'){return items.length?`<div class="feed">${items.map(e=>`<div class="it"><span class="k ${esc(e.kind)}">${KIND[e.kind]||esc(e.kind)}</span><div>${esc(e.text).replace(/\n/g,'<br>')}${e.actor?`<div class="muted" style="font-size:12px">${esc(e.actor)}</div>`:''}</div><span class="t">${fmtTime(e.at)}</span></div>`).join('')}</div>`:`<div class="empty">${empty}</div>`}

    <section class="card kpi"><span class="label">本月拦截</span><span class="v ${blocked?'block':''}">${blocked}</span><span class="s">涉及 ${Object.entries(m.blocked_value).map(([t,v])=>fmtNum(v)+' '+esc(t)).join('、')||'0'}</span></section>

    ${card('最近动态',feed(o.recent,'还没有操作或预警'),{flush:true,right:'<a class="btn sm" href="#audit">审计日志</a>'})}
  </div>
  <div class="grid g4">
    ${[['自动付',c.paid,'ok'],['老板已签',c.approved,'ok'],['已驳回',c.rejected,'muted'],['失败',c.failed,c.failed?'block':'muted']].map(([l,v,k])=>`<section class="card kpi"><span class="label">本月 · ${l}</span><span class="v ${k}">${v||0}</span></section>`).join('')}

BIND.approvals=()=>{

function bindDetail(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail))}
async function showDetail(id){
  try{const d=await api('/api/payments/'+encodeURIComponent(id));const [ol,oc]=OUTCOME[d.outcome]||[d.outcome,'muted'];
  drawer(id,`<div class="row">${st(d.status)}<span class="pill ${oc}">规则判断：${ol}</span></div>
    <dl class="kv">
      <dt>收款方</dt><dd>${d.payee_name?esc(d.payee_name)+'<br>':''}${addr(d.payee,d.payee_url)}</dd>
      <dt>金额</dt><dd>${fmtAmt(d.amount,d.token)}</dd>
      <dt>用途</dt><dd>${esc(d.memo||'—')}</dd><dt>类别</dt><dd>${esc(d.category||'—')}</dd>
      <dt>谁发的</dt><dd>${esc(d.requester)}</dd>
      <dt>收到时间</dt><dd class="mono">${fmtTime(d.created_at)}</dd><dt>最后更新</dt><dd class="mono">${fmtTime(d.updated_at)}</dd>
      ${d.tx_hash?`<dt>交易</dt><dd>${d.tx_url?`<a href="${esc(d.tx_url)}" target="_blank" rel="noreferrer" class="mono">${esc(short(d.tx_hash))}</a> `:`<span class="mono">${esc(d.tx_hash)}</span>`} <button class="copy" data-copy="${esc(d.tx_hash)}">复制</button></dd>`:''}
      ${d.safe_tx_hash?`<dt>Safe 交易哈希</dt><dd>${addr(d.safe_tx_hash)}</dd>`:''}
      ${d.decided_by?`<dt>处理人</dt><dd>${esc(d.decided_by)}</dd>`:''}
      ${d.error?`<dt>错误</dt><dd class="block">${esc(d.error)}</dd>`:''}
    </dl>
    <div class="stack"><span class="label">规则命中</span><div class="row">${d.messages.length?d.messages.map(m=>`<span class="chip ${oc}">${esc(m)}</span>`).join(''):'<span class="muted">全部规则通过</span>'}</div></div>
    <div class="stack"><span class="label">经过</span><ol class="steps">
      <li class="done">${fmtTime(d.created_at)} 收到请求，规则判断为「${ol}」，先记账</li>
      ${d.status==='paid'?`<li class="done">员工在限额内自动付款${d.tx_url?'，已上链':''}</li>`:''}
      ${d.status==='failed'?`<li>付款失败，请求作废</li>`:''}
      ${d.history.slice().reverse().map(h=>`<li class="done">${fmtTime(h.at)} ${esc(h.text)}（${esc(h.actor)}）</li>`).join('')}
      ${d.status==='pending_approval'?'<li>等老板签字</li>':''}
    </ol></div>
    ${d.status==='pending_approval'?`<div class="row"><button class="btn ok" data-ap2>已签字</button><button class="btn danger" data-rj2>驳回</button></div>`:''}`);
  const ap=$('#overlay [data-ap2]'),rj=$('#overlay [data-rj2]');
  if(ap)ap.onclick=async()=>{$('#overlay').innerHTML='';await act(()=>post(`/api/payments/${encodeURIComponent(id)}/approve`))};
  if(rj)rj.onclick=async()=>{$('#overlay').innerHTML='';await act(()=>post(`/api/payments/${encodeURIComponent(id)}/reject`))};
  }catch(e){toast(e.message,true)}}

// ---------- 03 ledger ----------
function ledgerQuery(extra){const f=S.ledger.f,q=new URLSearchParams();for(const k of ['status','token','payee','q','start','end'])if(f[k])q.set(k,f[k]);if(extra)for(const[k,v]of Object.entries(extra))q.set(k,v);return q.toString()}
VIEWS.ledger=async()=>{
  const f=S.ledger.f,tokens=[...new Set([...Object.keys(S.rules.single_limit||{}),...Object.keys(S.rules.daily_limit||{})])];
  const rows=await api('/api/payments?'+ledgerQuery({limit:S.ledger.limit}));
  const sum={};rows.forEach(r=>{if(r.status==='paid'||r.status==='approved')sum[r.token]=(sum[r.token]||0)+Number(r.amount)});
  return `
  <section class="card"><div class="bd"><div class="grid g4" style="gap:10px">
    <label class="f"><span>状态</span><select id="fStatus"><option value="">全部</option>${Object.entries(STATUS).map(([k,[l]])=>`<option value="${k}" ${f.status===k?'selected':''}>${l}</option>`).join('')}<option value="paid,approved" ${f.status==='paid,approved'?'selected':''}>已付出（自动 + 签字）</option></select></label>
    <label class="f"><span>币种</span><select id="fToken"><option value="">全部</option>${tokens.map(t=>`<option ${f.token===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
    <label class="f"><span>从</span><input type="date" id="fStart" value="${esc((f.start||'').slice(0,10))}"></label>
    <label class="f"><span>到（含）</span><input type="date" id="fEnd" value="${esc(f.endDay||'')}"></label>
  </div>
  <div class="row" style="margin-top:10px"><input id="fQ" class="grow" style="width:auto" placeholder="搜索编号、用途、类别、发起人、地址" value="${esc(f.q||'')}">
    ${f.payee?`<span class="chip">收款方 ${esc(short(f.payee))}<button data-clearpayee aria-label="清除">×</button></span>`:''}
    <button class="btn" id="fApply">筛选</button><button class="btn ghost" id="fReset">清空</button><button class="btn" id="csv">导出 CSV</button></div></div></section>
  <section class="card"><div class="hd"><h2>${rows.length} 笔${rows.length>=S.ledger.limit?'（只显示最近 '+S.ledger.limit+' 笔）':''}</h2><span class="muted" style="font-size:12px">已付出：${Object.entries(sum).map(([t,v])=>fmtNum(v)+' '+esc(t)).join('、')||'0'}</span></div>
  <div class="bd flush scroll">${rows.length?`<table><thead><tr><th>时间</th><th>编号</th><th>收款方</th><th class="r">金额</th><th class="hide-sm">用途</th><th>状态</th><th class="hide-sm">原因 / 交易</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" data-detail="${esc(r.request_id)}"><td class="mono" style="white-space:nowrap">${fmtTime(r.created_at)}</td><td class="mono">${esc(r.request_id)}</td><td>${r.payee_name?esc(r.payee_name):`<span class="mono">${esc(short(r.payee))}</span>`}</td><td class="r" style="white-space:nowrap">${fmtAmt(r.amount,r.token)}</td><td class="hide-sm">${esc(r.memo||'—')}</td><td>${st(r.status)}</td><td class="hide-sm muted" style="font-size:12px">${r.messages.length?esc(r.messages.join('；')):(r.tx_hash?`<span class="mono">${esc(short(r.tx_hash))}</span>`:'')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有符合条件的记录</div>'}</div>
  ${rows.length>=S.ledger.limit?`<div class="bd" style="border-top:1px solid var(--line)"><button class="btn" id="more">再加载 ${S.ledger.limit} 笔</button></div>`:''}</section>`};
BIND.ledger=()=>{
  const apply=()=>{const end=$('#fEnd').value;S.ledger.f={...S.ledger.f,status:$('#fStatus').value,token:$('#fToken').value,q:$('#fQ').value.trim(),start:$('#fStart').value,endDay:end,end:end?new Date(new Date(end+'T00:00:00Z').getTime()+864e5).toISOString().slice(0,10):''};S.ledger.limit=100;render()};
  $('#fApply').onclick=apply;$('#fQ').onkeydown=e=>{if(e.key==='Enter')apply()};
  ['#fStatus','#fToken','#fStart','#fEnd'].forEach(s=>$(s).onchange=apply);
  $('#fReset').onclick=()=>{S.ledger.f={};render()};
  const cp=document.querySelector('[data-clearpayee]');if(cp)cp.onclick=()=>{delete S.ledger.f.payee;render()};
  const more=$('#more');if(more)more.onclick=()=>{S.ledger.limit+=100;render()};
  $('#csv').onclick=async()=>{if(window.CONSOLE_DEMO)return toast('演示版不能下载文件。正式版点这里会下载当前筛选结果的 CSV。');try{const t=await api('/api/payments.csv?'+ledgerQuery());const url=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='ledger-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出')}catch(e){toast(e.message,true)}};
  bindDetail()};

VIEWS.payees=async()=>{

async function saveRules(mut,ok){const cfg=JSON.parse(JSON.stringify(S.rules));mut(cfg);

BIND.rules=async()=>{
  const mark=()=>{S.dirtyRules=true;$('#dirty').hidden=false};
  document.querySelectorAll('#page input,#page select').forEach(i=>{if(!['simText','newTok'].includes(i.id))i.addEventListener('input',mark)});
  const collect=()=>{const c=JSON.parse(JSON.stringify(S.rules)),list=s=>s.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
    c.single_limit={};c.daily_limit={};document.querySelectorAll('#limits tbody tr').forEach(tr=>{c.single_limit[tr.dataset.tok]=tr.querySelector('[data-s]').value.trim();c.daily_limit[tr.dataset.tok]=tr.querySelector('[data-d]').value.trim()});
    c.approval_categories=list($('#cats').value);c.duplicate_window_days=parseInt($('#dup').value,10)||30;c.timezone=$('#tz').value;c.owners=list($('#owners').value);c.read_only=$('#ro').checked;return c};
  $('#saveRules').onclick=async()=>{const c=collect();try{const r=await put('/api/rules',c);S.dirtyRules=false;toast(r.changes.length?'已保存：'+r.changes.join('；'):'没有改动');await refresh()}catch(e){toast(e.message,true)}};
  $('#resetRules').onclick=()=>{S.dirtyRules=false;render()};
  $('#addTok').onclick=()=>{const t=$('#newTok').value.trim().toUpperCase();if(!/^[A-Z0-9]{2,10}$/.test(t))return toast('币种代码 2–10 位字母或数字',true);
    if(document.querySelector(`#limits tr[data-tok="${t}"]`))return toast('已经有 '+t,true);
    $('#limits tbody').insertAdjacentHTML('beforeend',`<tr data-tok="${esc(t)}"><td class="mono">${esc(t)}</td><td><input class="mono" data-s value="0"></td><td><input class="mono" data-d value="0"></td><td><button class="btn sm ghost" data-rmtok>移除</button></td></tr>`);$('#newTok').value='';mark()};
  $('#limits').onclick=e=>{const b=e.target.closest('[data-rmtok]');if(b){b.closest('tr').remove();mark()}};
  const sim=async()=>{const text=$('#simText').value.trim();if(!text)return;try{const r=await post('/api/simulate',{text});
    if(!r.parsed){$('#simOut').innerHTML=`<div class="note">员工没看懂这句话，会在群里追问：<br>${esc(r.reply)}</div>`;return}
    const [l,c]=OUTCOME[r.outcome];
    $('#simOut').innerHTML=`<div class="stack"><div class="row"><span class="pill ${c}"><span class="dot"></span>${l}</span><span>${r.payee_name?esc(r.payee_name):`<span class="mono">${esc(short(r.payee))}</span>`} · ${fmtAmt(r.amount,r.token)}</span>${r.category?`<span class="chip">${esc(r.category)}</span>`:''}</div>
      ${r.messages.length?`<div class="row">${r.messages.map(m=>`<span class="chip ${c}">${esc(m)}</span>`).join('')}</div>`:'<span class="muted">所有规则都通过</span>'}
      <span class="label">员工在群里会这样回</span><div class="chat" style="height:auto;max-height:260px"><div class="msg me"><span class="who">你</span>${esc(text)}</div><div class="msg bot"><span class="who">KAGOU 员工</span>${esc(r.reply)}</div></div></div>`}catch(e){toast(e.message,true)}};
  $('#simGo').onclick=sim;$('#simText').onkeydown=e=>{if(e.key==='Enter')sim()};
  document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{$('#simText').value=b.dataset.ex;sim()});
  try{$('#rulesText').textContent=(await api('/api/preview/rules')).text}catch(e){$('#rulesText').textContent=e.message}};

    <section class="card kpi"><span class="label">状态</span><span class="v ${t.online?'ok':'block'}" style="font-size:18px">${t.online?'在线':'离线'}</span><span class="s">最后心跳 ${ago(t.heartbeat)}</span></section>
    <section class="card kpi"><span class="label">通知群</span><span class="v mono" style="font-size:16px">${esc(t.chat||'未设置')}</span><span class="s">${t.chat_source==='console'?'在控制台设置':t.chat_source==='env'?'部署时设置':'周报、预警发到这里'}</span></section>
    <section class="card kpi"><span class="label">群消息权限</span><span class="v ${t.bot?(t.bot.reads_all_group_messages?'ok':'block'):'muted'}" style="font-size:18px">${t.bot?(t.bot.reads_all_group_messages?'能看全部消息':'只能看命令'):'—'}</span><span class="s">${t.bot&&!t.bot.reads_all_group_messages?'去 @BotFather /setprivacy 选 Disable':'隐私模式要关掉'}</span></section>
  </div>
  <div class="grid g2" style="align-items:start">
  <div class="stack" style="gap:16px">
  ${card('接入步骤',`<ol class="steps">${steps.map(([ok,txt])=>`<li class="${ok?'done':''}">${esc(txt)}</li>`).join('')}</ol>`)}
  ${card('通知群和审批人',`<div class="stack">
    <label class="f"><span>群 ID</span><div class="row"><input id="chatId" class="mono grow" style="width:auto" value="${esc(t.chat||'')}" placeholder="-1001234567890"><button class="btn" id="saveChat">保存</button></div></label>
    <p class="muted" style="margin:0;font-size:12px">怎么拿群 ID：把 @RawDataBot 拉进群，它会回一串以 -100 开头的数字，拿到后把它踢掉。</p>
    <div><span class="label">审批人（老板）</span><div class="row" style="margin-top:6px">${t.owners.map(o=>`<span class="chip">@${esc(o)}</span>`).join('')||'<span class="block">还没设置，任何人都不能审批</span>'}<a class="btn sm" href="#rules">修改</a></div></div></div>`)}
  ${card('自动通知',`<div class="stack">
    <div class="row"><label class="switch grow"><input type="checkbox" id="sWeekly" ${s.weekly_report?'checked':''}> 每周周报</label><select id="sWeekday" style="width:auto">${WEEK.map((w,i)=>`<option value="${i}" ${s.report_weekday===i?'selected':''}>${w}</option>`).join('')}</select><select id="sHour" style="width:auto">${[...Array(24).keys()].map(h=>`<option value="${h}" ${s.report_hour===h?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select></div>
    <div class="row"><label class="switch grow"><input type="checkbox" id="sDigest" ${s.daily_digest?'checked':''}> 每日账本</label><select id="sDigestHour" style="width:auto">${[...Array(24).keys()].map(h=>`<option value="${h}" ${s.digest_hour===h?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select></div>
    <div class="row"><label class="switch grow"><input type="checkbox" id="sRemind" ${s.pending_reminder_hours?'checked':''}> 有付款没签字时提醒老板，每隔</label><select id="sRemindH" style="width:auto">${[1,2,4,8,12,24].map(h=>`<option value="${h}" ${(s.pending_reminder_hours||4)===h?'selected':''}>${h} 小时</option>`).join('')}</select></div>
    <label class="switch"><input type="checkbox" id="sAlerts" ${s.treasury_alerts?'checked':''}> 国库预警发到群里</label>
    <label class="switch"><input type="checkbox" id="sQuiet" ${s.quiet_auto_pay?'checked':''}> 自动付款只回一行（群里消息多时更清爽）</label>
    <div class="row"><button class="btn primary" id="saveNotify">保存通知设置</button><span class="muted" style="font-size:12px">时间按规则里的时区（${esc(S.rules.timezone)}）</span></div></div>`)}
  ${card('现在发到群里',`<div class="stack">
    <div class="row">${[['report','上周周报'],['today','今日账本'],['pending','待签字列表'],['rules','当前规则']].map(([k,l])=>`<button class="btn sm" data-send="${k}">${l}</button>`).join('')}</div>
    <textarea id="customMsg" placeholder="自定义消息，例如：本周五前把发票发到群里"></textarea>
    <div class="row"><button class="btn signal" id="sendCustom">发送</button><span class="muted" style="font-size:12px">消息先排队，机器人几秒内发出</span></div>
    ${t.outbox.length?`<div class="scroll"><table><thead><tr><th>时间</th><th>内容</th><th>状态</th></tr></thead><tbody>${t.outbox.map(o=>`<tr><td class="mono" style="white-space:nowrap">${fmtTime(o.at)}</td><td>${esc(o.text.slice(0,60))}${o.text.length>60?'…':''}</td><td style="white-space:nowrap">${o.error?`<span class="block" title="${esc(o.error)}">失败</span>`:o.sent_at?'<span class="ok">已发</span>':'<span class="review">排队中</span>'}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`)}
  </div>
  <div class="stack" style="gap:16px">
  <section class="card"><div class="hd"><h2>群聊模拟器</h2><span class="label">不记账 · 不发群</span></div>
    <div class="chat" id="chat" aria-live="polite">${S.tgChat.length?S.tgChat.map(m=>`<div class="msg ${m.me?'me':'bot'}"><span class="who">${m.me?'你':'KAGOU 员工'}</span>${esc(m.text)}</div>`).join(''):'<div class="muted" style="margin:auto;text-align:center;font-size:13px">像在群里一样发消息，看员工怎么回。<br>付款请求只试算，不会真的记账或付款。</div>'}</div>
    <div class="sug">${['付 Alice 300 USDT 设计费','付 Mia 200 USDT KOL','/rules','/today','/pending','/report','/help'].map(x=>`<button class="btn sm ghost" data-say="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    <div class="chatbar"><input id="say" class="grow" placeholder="付 Bob 120 USDT 翻译费 或 /help"><button class="btn primary" id="sayGo">发送</button></div></section>
  ${card('命令速查',`<table><tbody>${t.commands.map(c=>`<tr><td class="mono" style="white-space:nowrap">${esc(c.cmd)}</td><td>${esc(c.desc)}${c.owner_only?' <span class="chip review">仅老板</span>':''}</td></tr>`).join('')}</tbody></table>`,{flush:true})}
  ${card('群消息记录',t.messages.length?`<div class="chat" id="chatLog" style="height:360px">${t.messages.slice().reverse().map(m=>`<div class="msg ${m.kind==='telegram_in'?'me':'bot'}"><span class="who">${esc(m.kind==='telegram_in'?m.actor:'KAGOU 员工')} · ${fmtTime(m.at)}</span>${esc(m.text)}</div>`).join('')}</div>`:'<div class="empty">机器人处理过的消息会出现在这里</div>',{flush:true})}
  </div></div>`};
BIND.telegram=()=>{
  $('#saveChat').onclick=()=>act(()=>put('/api/telegram/chat',{chat:$('#chatId').value.trim()}),'通知群已保存');
  $('#saveNotify').onclick=()=>act(()=>put('/api/telegram/settings',{weekly_report:$('#sWeekly').checked,report_weekday:+$('#sWeekday').value,report_hour:+$('#sHour').value,daily_digest:$('#sDigest').checked,digest_hour:+$('#sDigestHour').value,pending_reminder_hours:$('#sRemind').checked?+$('#sRemindH').value:0,treasury_alerts:$('#sAlerts').checked,quiet_auto_pay:$('#sQuiet').checked}),'通知设置已保存，机器人立即生效');
  document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>act(()=>post('/api/telegram/send',{kind:b.dataset.send})));
  $('#sendCustom').onclick=async()=>{const text=$('#customMsg').value.trim();if(!text)return toast('消息不能为空',true);if(await confirmBox('发到群里？',esc(text).replace(/\n/g,'<br>'),'发送'))act(()=>post('/api/telegram/send',{kind:'custom',text}))};
  for(const el of [$('#chat'),$('#chatLog')])if(el)el.scrollTop=el.scrollHeight;
  const say=async text=>{text=text.trim();if(!text)return;S.tgChat.push({me:true,text});let reply;
    try{const cmd=text.match(/^\/(\w+)/);
      if(cmd){const c=cmd[1].toLowerCase();
        if(['approve','reject','pause','resume'].includes(c))reply=`/${c} 是老板命令，会真的改变付款状态，模拟器里不执行。到「审批」页或右上角按钮操作。`;
        else if(c==='start')reply=(await api('/api/preview/help')).text;
        else reply=(await api('/api/preview/'+c)).text}
      else{const r=await post('/api/simulate',{text});reply=r.reply}}
    catch(e){reply=e.message}
    S.tgChat.push({me:false,text:reply});S.tgChat=S.tgChat.slice(-40);render()};
  $('#sayGo').onclick=()=>say($('#say').value);$('#say').onkeydown=e=>{if(e.key==='Enter')say($('#say').value)};
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
  setTimeout(()=>{const i=$('#say');if(i&&S.tgChat.length)i.focus()},0)};

// ---------- 09 reports ----------
S.week=0;
VIEWS.reports=async()=>{const [w,d]=await Promise.all([api('/api/report/weekly?weeks_ago='+S.week),api('/api/report/today')]);
  return `<div class="grid g2" style="align-items:start">
  ${card('周报',`<div class="stack"><div class="row"><select id="week" style="width:auto">${[...Array(13).keys()].map(i=>`<option value="${i}" ${S.week===i?'selected':''}>${i===0?'上周':i+1+' 周前'}</option>`).join('')}</select><button class="btn sm" data-copy="${esc(w.text)}">复制</button><button class="btn sm" data-sendr="report">发到群里</button></div><pre class="report">${esc(w.text)}</pre></div>`)}
  ${card('今日账本',`<div class="stack"><div class="row"><button class="btn sm" data-copy="${esc(d.text)}">复制</button><button class="btn sm" data-sendr="today">发到群里</button></div><pre class="report">${esc(d.text)}</pre></div>`)}
  </div>
  ${card('导出',`<div class="row"><span class="grow muted">完整账本（含所有字段）导出成 CSV，Excel 可以直接打开。</span><a class="btn" href="#ledger">去账本导出</a></div>`)}`};
BIND.reports=()=>{$('#week').onchange=e=>{S.week=+e.target.value;render()};
  document.querySelectorAll('[data-sendr]').forEach(b=>b.onclick=()=>act(()=>post('/api/telegram/send',{kind:b.dataset.sendr})))};

// ---------- 10 audit ----------
VIEWS.audit=async()=>{const k=S.audit.kind;const items=await api('/api/events?limit=100'+(k?'&kind='+k:''));S.audit.items=items;
  const tabs=[['','全部'],['audit','操作'],['alert','预警'],['telegram_in,telegram_out','Telegram'],['system','系统']];
  return `<section class="card"><div class="tabs" role="tablist">${tabs.map(([v,l])=>`<button role="tab" aria-selected="${k===v}" data-kind="${v}">${l}</button>`).join('')}</div>
  <div id="auditFeed">${feed(items,'没有记录')}</div>
  ${items.length>=100?'<div class="bd" style="border-top:1px solid var(--line)"><button class="btn" id="auditMore">加载更早的</button></div>':''}</section>
  <p class="muted" style="font-size:12px;margin:0">审计日志只增不删：暂停、恢复、签字、驳回、修改规则、发群消息、非老板的越权尝试都会记下来。</p>`};
BIND.audit=()=>{document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{S.audit.kind=b.dataset.kind;render()});
  const m=$('#auditMore');if(m)m.onclick=async()=>{const last=S.audit.items[S.audit.items.length-1];const more=await api(`/api/events?limit=100&before=${last.id}`+(S.audit.kind?'&kind='+S.audit.kind:''));S.audit.items=S.audit.items.concat(more);$('#auditFeed').innerHTML=feed(S.audit.items);if(more.length<100)m.remove()}};

// ---------- 11 settings ----------
VIEWS.settings=async()=>`
  <div class="grid g2" style="align-items:start">
  ${card('外观',`<div class="stack"><label class="f"><span>主题</span><select id="theme">${[['dark','深色'],['light','浅色'],['auto','跟随系统']].map(([v,l])=>`<option value="${v}" ${store.get('cs-theme','dark')===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f"><span>自动刷新</span><select id="auto">${[['0','关'],['15','每 15 秒'],['60','每分钟']].map(([v,l])=>`<option value="${v}" ${store.get('cs-auto','60')===v?'selected':''}>${l}</option>`).join('')}</select></label></div>`)}
  ${card('登录',`<div class="stack"><p class="muted" style="margin:0">令牌只保存在这个标签页。换令牌要在服务器上改 <code>CHAINSTAFF_CONSOLE_TOKEN</code> 并重启控制台，旧令牌立即失效。</p><div><button class="btn" id="logout">退出登录</button></div></div>`)}
  ${card('紧急操作',`<div class="stack"><p class="muted" style="margin:0">发现异常时先暂停：之后所有付款请求都会被拦截，直到恢复。Telegram 群里老板发 /pause 效果一样。</p><div><button class="btn danger" id="kill2">${S.status.paused?'恢复付款':'一键暂停所有付款'}</button></div></div>`)}
  ${card('快捷键',`<table><tbody><tr><td class="mono">R</td><td>刷新数据</td></tr><tr><td class="mono">Esc</td><td>关闭弹窗和详情</td></tr></tbody></table>`,{flush:true})}
  </div>`;
BIND.settings=()=>{$('#theme').onchange=e=>{store.set('cs-theme',e.target.value);applyTheme()};
  $('#auto').onchange=e=>{store.set('cs-auto',e.target.value);startAuto();toast('已保存')};
  $('#logout').onclick=()=>logout('已退出');$('#kill2').onclick=()=>$('#kill').click()};

// ---------- boot ----------
function applyTheme(){const t=store.get('cs-theme','dark'),r=document.documentElement;r.removeAttribute('data-auto');
  if(t==='auto'){r.removeAttribute('data-theme');r.setAttribute('data-auto','1')}else r.setAttribute('data-theme',t)}
let timer;function startAuto(){clearInterval(timer);const s=+store.get('cs-auto','60');if(s)timer=setInterval(()=>{if(document.visibilityState==='visible'&&!$('#overlay').innerHTML&&!S.dirtyRules&&!(document.activeElement&&document.activeElement.matches('input,textarea,select')))refresh()},s*1000)}
function logout(msg){token='';try{sessionStorage.removeItem('cs-token')}catch(e){}$('#app').hidden=true;$('#login').hidden=false;$('#loginMsg').textContent=msg||'';clearInterval(timer)}
async function connect(){token=$('#token').value.trim()||token;if(!token)return;
  try{await api('/api/status');try{sessionStorage.setItem('cs-token',token)}catch(e){}$('#login').hidden=true;$('#app').hidden=false;S.route=route();await refresh();startAuto()}
  catch(e){$('#loginMsg').textContent=e.message}}
$('#connect').onclick=connect;$('#token').onkeydown=e=>{if(e.key==='Enter')connect()};
applyTheme();
if(window.CONSOLE_DEMO){$('#demoBar').hidden=false;$('#demoBar').innerHTML=window.CONSOLE_DEMO}
if(token)connect();
})();
</script>
</body>
</html>
