name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (rule engine and money paths must stay at 100% coverage)
        run: pytest --cov=agent --cov-fail-under=99
      - name: Dependency vulnerability scan
        run: pip-audit --skip-editable
      - name: Static security scan
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/secrets --error agent bot backend scripts
