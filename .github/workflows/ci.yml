name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (rule engine and money paths must stay at 100% coverage)
        run: pytest --cov=agent --cov-fail-under=99
      - name: Live-mode check (real server process, SSE, restart; simulated chain node, no network)
        run: python scripts/live_check.py --sim-chain --out live-check-sim.json
      - name: AI check script against a scripted chat endpoint (mock model, simulated chain; the real run is ai-check.yml)
        run: |
          python tests/support/scripted_chat_server.py 18999 &
          AI_PROVIDER=local AI_BASE_URL=http://127.0.0.1:18999/v1 AI_MODEL=scripted python scripts/ai_check.py --sim-chain --wait 60 --out ai-check-mock.json
      - name: Autonomous agents end to end (API + separate worker process + scripted model endpoint, a mock; worker killed mid-run)
        run: python scripts/autonomy_check.py --out autonomy-check-mock.json
      - name: Dependency vulnerability scan
        run: pip-audit --skip-editable
      - name: Static security scan
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/secrets --error agent backend scripts

  bsc-testnet:
    # Read-only checks against the real BSC testnet (public RPC and WebSocket nodes): no keys, no transactions.
    # Kept apart from "test" so a slow public node never blocks a PR; the result is evidence, not a gate.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: BSC testnet smoke test
        env:
          KAGOU_TESTNET: "1"
          KAGOU_TESTNET_OUT: testnet-results.json
        run: pytest tests/test_bsc_testnet.py -v -p no:cacheprovider
      - name: Live-mode check on BSC testnet (real server process, real chain, no model)
        if: always()
        run: python scripts/live_check.py --chain --wait 120 --out live-check-testnet.json
      - name: Results
        if: always()
        run: |
          for f in testnet-results.json live-check-testnet.json; do
            if [ -f "$f" ]; then
              { echo "### $f"; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              cat "$f"
            fi
          done

  terminal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/terminal/package-lock.json
      - run: npm ci
      - name: Type check and production build
        run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=moderate
