name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: 构建产物中不得出现私钥模式
        run: |
          if grep -rEo --include='*.js' --include='*.html' '[1-9A-HJ-NP-Za-km-z]{87,88}' dist; then echo "发现疑似 Solana 私钥"; exit 1; fi
          if grep -rEio --include='*.js' --include='*.html' 'BEGIN (EC |RSA )?PRIVATE KEY|seed ?phrase|mnemonic' dist; then echo "发现疑似私钥/助记词"; exit 1; fi
