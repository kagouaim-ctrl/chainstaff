[project]
name = "chainstaff"
version = "0.0.1"
description = "链工 ChainStaff · AI 财务运营员"
requires-python = ">=3.11"

dependencies = [
    "aiogram>=3.4,<4",
    "eth-abi>=5",
    "eth-account>=0.11",
    "eth-utils>=4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "pip-audit"]
chain = ["bnbagent>=0.5"]

[tool.setuptools.packages.find]
include = ["agent*", "bot*", "backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
