[project]
name = "chainstaff"
version = "0.0.1"
description = "链工 ChainStaff · AI 财务运营员"
requires-python = ">=3.11"

dependencies = ["aiogram>=3.4,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["agent*", "bot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
